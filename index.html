<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活多久 | 你的健康寿命测试</title>
  <meta name="description" content="40道科学题目，测测你的健康寿命指数。你还能活多久，其实取决于今天怎么生活！">
  <style>
    :root {
      --bg: #f0f5f0;
      --panel: #ffffff;
      --text: #1a2e1a;
      --muted: #5a6e5a;
      --line: #d4e4d4;
      --soft: #e8f2e8;
      --accent: #4a7c59;
      --accent-light: #6ba37a;
      --accent-strong: #2d5a3a;
      --accent-bg: #f0f8f2;
      --shadow: 0 8px 32px rgba(42,80,50,0.06);
      --shadow-lg: 0 20px 60px rgba(42,80,50,0.1);
      --radius: 20px;
      --radius-lg: 28px;
      --success: #2d8a4e;
      --warning: #e68a00;
      --danger: #d32f2f;
      --danger-bg: #fef2f2;
      --warning-bg: #fffbeb;
      --success-bg: #e8f5e9;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{color:var(--text);background:var(--bg);min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
    .shell{max-width:720px;margin:0 auto;padding:16px 16px 80px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
    button{cursor:pointer;font:inherit;border:0;transition:transform .15s,box-shadow .15s,opacity .15s;-webkit-tap-highlight-color:transparent}
    button:hover{transform:translateY(-1px)}
    button:active{transform:scale(0.98)}
    button:disabled{cursor:not-allowed;opacity:.4;transform:none}
    .btn-primary{background:var(--accent-strong);color:#fff;border-radius:16px;padding:16px 32px;font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(45,90,58,0.25);letter-spacing:.02em}
    .btn-primary:hover{box-shadow:0 12px 32px rgba(45,90,58,0.3)}
    .btn-secondary{color:var(--accent-strong);border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:14px 28px;font-weight:700;font-size:15px}
    .screen{display:none}.screen.active{display:block}

    /* ===== INTRO ===== */
    .intro{padding:0}
    .intro-hero{padding:48px 28px 36px;text-align:center;position:relative;background:linear-gradient(180deg,#f5faf5 0%,#fff 100%)}
    .intro-hero::before{content:"";position:absolute;top:-80px;right:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(74,124,89,0.08),transparent 70%);pointer-events:none}
    .intro-hero::after{content:"";position:absolute;bottom:-60px;left:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(74,124,89,0.05),transparent 70%);pointer-events:none}
    .intro-logo{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px}
    .intro h1{font-size:clamp(32px,7vw,56px);line-height:1.08;letter-spacing:-.03em;color:var(--text)}
    .intro h1 em{font-style:normal;color:var(--accent-strong);position:relative}
    .intro h1 em::after{content:"";position:absolute;bottom:2px;left:0;right:0;height:3px;background:var(--accent);border-radius:2px;opacity:.4}
    .intro-slogan{margin-top:16px;font-size:clamp(14px,3vw,17px);color:var(--muted);line-height:1.7;letter-spacing:.01em}
    .intro-stats{display:flex;justify-content:center;gap:0;margin-top:28px;flex-wrap:wrap}
    .intro-stat{flex:1;min-width:100px;padding:16px 12px;text-align:center;border-right:1px solid var(--line)}
    .intro-stat:last-child{border-right:none}
    .intro-stat .num{font-size:24px;font-weight:800;color:var(--accent-strong)}
    .intro-stat .lbl{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.04em}
    .intro-form{padding:28px;border-top:1px solid var(--line)}
    .disclaimer-bar{background:linear-gradient(90deg,#fff8e1,#fff3cd);border-top:1px solid #ffe082;border-bottom:1px solid #ffe082;padding:10px 20px;font-size:11px;color:#8d6e23;text-align:center;letter-spacing:.02em}
    .input-group{margin-bottom:18px}
    .input-group label{display:block;font-weight:700;margin-bottom:8px;font-size:13px;color:var(--accent-strong);letter-spacing:.04em}
    .input-row input[type="number"]{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;font-size:17px;outline:none;transition:border-color .2s;background:#fff;color:var(--text)}
    .input-row input:focus{border-color:var(--accent)}
    .gender-group{display:flex;gap:12px}
    .gender-btn{flex:1;padding:14px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:16px;font-weight:600;text-align:center;transition:all .2s}
    .gender-btn.selected{border-color:var(--accent-strong);background:var(--accent-bg);color:var(--accent-strong)}
    .intro-actions{padding:0 28px 32px;display:flex;gap:12px}
    .intro-actions .btn-primary{width:100%}
    .intro-footer{padding:16px 28px 24px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:11px;line-height:1.8;opacity:.7}

    /* ===== TEST ===== */
    .test-wrap{padding:20px}
    .topbar{margin-bottom:16px}
    .progress{background:#e0ebe0;border-radius:999px;height:10px;overflow:hidden}
    .progress>span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent-light),var(--accent-strong));transition:width .3s}
    .progress-info{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
    .dim-badge{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:600;color:var(--accent-strong)}
    .question-card{margin-top:16px;animation:fadeUp .3s ease}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .question-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:12px;color:var(--muted)}
    .q-badge{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:600}
    .question-title{font-size:17px;line-height:1.7;font-weight:600;margin-bottom:14px}
    .options{display:flex;flex-direction:column;gap:8px}
    .option{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s;background:#fff;-webkit-user-select:none;user-select:none}
    .option:active{transform:scale(0.98)}
    .option.selected{border-color:var(--accent-strong);background:var(--accent-bg)}
    .option-radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;transition:all .15s;display:flex;align-items:center;justify-content:center}
    .option.selected .option-radio{border-color:var(--accent-strong);background:var(--accent-strong)}
    .option.selected .option-radio::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff}
    .option-checkbox{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;transition:all .15s;display:flex;align-items:center;justify-content:center}
    .option.selected .option-checkbox{border-color:var(--accent-strong);background:var(--accent-strong)}
    .option.selected .option-checkbox::after{content:'✓';color:#fff;font-size:13px;font-weight:800}
    .option-label{font-size:14px;line-height:1.5;flex:1}
    .nav-bar{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px;flex-wrap:wrap}
    .hint{color:var(--muted);font-size:13px;line-height:1.6}

    /* ===== RESULT ===== */
    .result-wrap{padding:0;overflow:visible}
    .result-hero{padding:40px 24px 32px;text-align:center;background:linear-gradient(180deg,#f0f8f0 0%,#fff 100%);position:relative}
    .result-hero::before{content:"";position:absolute;top:-100px;left:50%;transform:translateX(-50%);width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(74,124,89,0.06),transparent 70%);pointer-events:none}
    .result-tier{display:inline-block;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:4px 14px;border-radius:999px;letter-spacing:.08em;margin-bottom:12px}
    .result-type-emoji{font-size:64px;margin-bottom:8px;display:block}
    .result-type-name{font-size:clamp(28px,6vw,42px);font-weight:800;letter-spacing:-.02em;color:var(--text)}
    .result-type-code{display:inline-block;margin-top:8px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 14px;font-size:14px;font-weight:800;color:var(--accent-strong);font-family:'SF Mono','Fira Code',monospace;letter-spacing:.04em}
    .result-type-sub{margin-top:10px;color:var(--muted);font-size:14px;line-height:1.6;max-width:400px;margin-left:auto;margin-right:auto}

    .result-life-section{padding:0 24px 32px}
    .life-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .life-card{border:1px solid var(--line);border-radius:18px;padding:20px 16px;text-align:center;background:#fff;position:relative;overflow:hidden}
    .life-card.primary{background:linear-gradient(135deg,#f0f8f0,#e8f2e8);border-color:var(--accent-light)}
    .life-card .label{font-size:11px;color:var(--muted);letter-spacing:.06em;font-weight:600;text-transform:uppercase}
    .life-card .value{font-size:42px;font-weight:800;color:var(--accent-strong);margin:4px 0 0;line-height:1}
    .life-card .unit{font-size:14px;color:var(--muted);font-weight:600}
    .life-card .extra{font-size:13px;color:var(--success);font-weight:700;margin-top:6px}
    .life-card.primary .value{color:var(--accent-strong)}
    .life-diff{grid-column:span 2;background:linear-gradient(135deg,#e8f5e9,#c8e6c9);border:1px solid #a5d6a7;border-radius:14px;padding:14px;text-align:center}
    .life-diff .big{font-size:22px;font-weight:800;color:var(--accent-strong)}
    .life-diff .note{font-size:12px;color:var(--muted);margin-top:2px}

    .result-sections{padding:0 20px 32px;display:flex;flex-direction:column;gap:16px}
    .r-section{border:1px solid var(--line);border-radius:var(--radius);padding:20px;background:#fff}
    .r-section-title{font-size:15px;font-weight:800;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
    .r-section-title .icon{font-size:18px}
    .r-section p{font-size:14px;line-height:1.85;color:#2a3e2a}

    /* 雷达图 */
    .radar-wrap{text-align:center;padding:8px 0}
    .radar-wrap canvas{width:100%;max-width:300px;height:300px}

    /* 维度条 */
    .dim-bars{display:flex;flex-direction:column;gap:10px}
    .dim-bar-item{display:flex;align-items:center;gap:10px}
    .dim-bar-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
    .dim-bar-info{flex:1;min-width:0}
    .dim-bar-label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:3px}
    .dim-bar-label .score{font-weight:700;color:var(--accent-strong)}
    .dim-bar-track{height:8px;background:#e8f2e8;border-radius:999px;overflow:hidden}
    .dim-bar-fill{height:100%;border-radius:999px;transition:width 1s ease}
    .dim-bar-fill.plus{background:linear-gradient(90deg,var(--accent-light),var(--success))}
    .dim-bar-fill.zero{background:linear-gradient(90deg,#c8d6c8,#a5b8a5)}
    .dim-bar-fill.minus{background:linear-gradient(90deg,#e8a5a5,var(--danger))}
    .dim-level-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;flex-shrink:0;min-width:36px;text-align:center}
    .dim-level-tag.plus{background:#e8f5e9;color:#2d8a4e}
    .dim-level-tag.zero{background:#f0f0f0;color:#888}
    .dim-level-tag.minus{background:#fef2f2;color:#c62828}

    /* 改善建议 */
    .improve-list{display:flex;flex-direction:column;gap:10px}
    .improve-card{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px;background:#fff;transition:transform .15s}
    .improve-card:hover{transform:translateX(4px)}
    .improve-icon{font-size:28px;flex-shrink:0;width:40px;text-align:center}
    .improve-body{flex:1;min-width:0}
    .improve-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px}
    .improve-desc{font-size:12px;color:var(--muted);line-height:1.5}
    .improve-years{flex-shrink:0;background:var(--success-bg);border:1px solid #c8e6c9;border-radius:10px;padding:6px 12px;font-size:15px;font-weight:800;color:var(--success);white-space:nowrap}

    /* 潜力横幅 */
    .potential-banner{background:linear-gradient(135deg,#e8f5e9 0%,#c8e6c9 100%);border:2px solid #a5d6a7;border-radius:18px;padding:24px;text-align:center;margin-top:4px}
    .potential-banner .label{font-size:13px;color:var(--muted);margin-bottom:4px}
    .potential-banner .big{font-size:36px;font-weight:800;color:var(--accent-strong)}
    .potential-banner .big span{font-size:20px;color:var(--success)}
    .potential-banner .note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}

    /* 预警 */
    .warn-card{border-radius:12px;padding:14px 16px;margin-bottom:8px;font-size:13px;line-height:1.7;display:flex;gap:10px;align-items:flex-start}
    .warn-card.danger{background:var(--danger-bg);border:1px solid #fecaca;color:#991b1b}
    .warn-card.warning{background:var(--warning-bg);border:1px solid #fde68a;color:#92400e}
    .warn-icon{font-size:18px;flex-shrink:0;margin-top:1px}

    /* 类型描述 */
    .type-desc-text{font-size:15px;line-height:1.9;color:#2a3e2a;padding:4px 0}

    /* 操作按钮 */
    .result-actions{display:flex;gap:12px;margin-top:8px;padding:0 20px 32px}
    .result-actions button{flex:1}
    .result-disclaimer{padding:16px 24px 28px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:10px;line-height:1.8;opacity:.7}

    /* ===== RESPONSIVE ===== */
    @media(max-width:600px){
      .shell{padding:10px 10px 60px}
      .intro-hero{padding:36px 20px 28px}
      .intro-stats{gap:0}
      .intro-stat{min-width:80px;padding:12px 8px}
      .intro-stat .num{font-size:20px}
      .intro-form{padding:20px}
      .intro-actions{padding:0 20px 24px}
      .test-wrap{padding:14px}
      .result-hero{padding:28px 18px 24px}
      .result-type-emoji{font-size:48px}
      .life-card .value{font-size:32px}
      .life-cards{gap:10px}
      .result-sections{padding:0 14px 24px;gap:12px}
      .r-section{padding:16px}
      .potential-banner{padding:18px}
      .potential-banner .big{font-size:28px}
      .result-actions{flex-direction:column;padding:0 14px 24px}
    }

    /* 动画 */
    .fade-in{animation:fadeUp .5s ease}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    @keyframes countUp{from{opacity:0}to{opacity:1}}
  </style>
</head>
<body>
<div class="shell">

  <!-- ===== INTRO ===== -->
  <section id="intro" class="screen active">
    <div class="intro card fade-in">
      <div class="intro-hero">
        <div class="intro-logo">🧬 LifeSpan Test</div>
        <h1>你还能<em>活多久</em>？</h1>
        <p class="intro-slogan">其实取决于今天怎么生活</p>
        <div class="intro-stats">
          <div class="intro-stat"><div class="num">41</div><div class="lbl">科学题目</div></div>
          <div class="intro-stat"><div class="num">7</div><div class="lbl">评估维度</div></div>
          <div class="intro-stat"><div class="num">25</div><div class="lbl">人格类型</div></div>
        </div>
      </div>
      <div class="disclaimer-bar">⚠️ 本测试仅供娱乐参考，不替代专业医疗建议</div>
      <div class="intro-form">
        <div class="input-group">
          <label>你的年龄</label>
          <div class="input-row"><input type="number" id="ageInput" min="1" max="120" placeholder="请输入你的年龄"></div>
        </div>
        <div class="input-group">
          <label>你的性别</label>
          <div class="gender-group">
            <div class="gender-btn" data-gender="male" onclick="selectGender('male')">👨 男性</div>
            <div class="gender-btn" data-gender="female" onclick="selectGender('female')">👩 女性</div>
          </div>
        </div>
      </div>
      <div class="intro-actions">
        <button id="startBtn" class="btn-primary" disabled onclick="startTest()">开始测试 →</button>
      </div>
      <div class="intro-footer">
        参考：Framingham心脏研究 · Blue Zones长寿区 · WHO/中国人口寿命数据<br>
        题目基于公开流行病学文献设计，结果为概率估算<br>
        <span style="font-size:10px;opacity:.6;">公众号：秀彬的AI笔记</span>
      </div>
    </div>
  </section>

  <!-- ===== TEST ===== -->
  <section id="test" class="screen">
    <div class="test-wrap card fade-in">
      <div class="topbar">
        <div class="progress"><span id="progressBar" style="width:0%"></span></div>
        <div class="progress-info">
          <span id="progressText">0 / 41</span>
          <span id="dimLabel" class="dim-badge">—</span>
        </div>
      </div>
      <div id="questionArea" class="question-card"></div>
      <div class="nav-bar">
        <div class="hint" id="testHint">开始答题吧～</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn-secondary" id="prevBtn" onclick="prevQuestion()" style="display:none">← 上一题</button>
          <button class="btn-primary" id="nextBtn" onclick="nextQuestion()">下一题 →</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== RESULT ===== -->
  <section id="result" class="screen">
    <div class="result-wrap card fade-in" id="resultContent"></div>
  </section>

</div>

<script src="js/questions.js"></script>
<script src="js/types.js"></script>
<script src="js/algorithm.js"></script>
<script src="js/radar.js"></script>
<script src="js/app.js"></script>
</body>
</html>
